[workspace]
resolver = "2"
members = [
    "crates/uwebr-js",
    "crates/uwebr-html",
    "crates/uwebr-css",
    "crates/uwebr-core",
    "crates/uwebr-macro",
    "crates/uwebr-render",
    "crates/uwebr-app",
    "crates/uwebr-cli",
    "crates/uwebr-dynlib",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["uwebr contributors"]
repository = "https://github.com/uwebr/uwebr"
description = "Rust-native desktop app framework with Next.js-like DX, GPU rendering via wgpu + vello"

[workspace.dependencies]
# Shared dependencies
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Async
tokio = { version = "1.0", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Window + GPU
winit = "0.30"
wgpu = "30.0"
vello = "0.10"
vello_cpu = "0.0.6"
parley = "0.9"
taffy = "0.14"
kurbo = "0.11"

# HTML/CSS parsing
lightningcss = "1.0.0-alpha.72"
markup5ever = "0.14"

# Internal crates
uwebr-js = { path = "crates/uwebr-js" }
uwebr-html = { path = "crates/uwebr-html" }
uwebr-css = { path = "crates/uwebr-css" }
uwebr-core = { path = "crates/uwebr-core" }
uwebr-macro = { path = "crates/uwebr-macro" }
uwebr-render = { path = "crates/uwebr-render" }
uwebr-app = { path = "crates/uwebr-app" }
uwebr-dynlib = { path = "crates/uwebr-dynlib" }

# Testing
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
