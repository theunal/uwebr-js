[package]
name = "uwebr-js"
version = "0.1.0"
edition = "2021"
description = "JavaScript to Rust transpiler"
license = "MIT"

[lib]
name = "uwebr_js"
path = "src/lib.rs"

[[bin]]
name = "js2rs"
path = "src/bin/js2rs_cli.rs"

[dependencies]
swc_ecma_parser = "45.1"
swc_ecma_ast = "29"
swc_ecma_visit = "29"
swc_atoms = "10"
swc_common = "26"
anyhow = "1.0.104"
thiserror = "2.0.20"
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
once_cell = "1.21.4"

[dev-dependencies]
tempfile = "3.27"
