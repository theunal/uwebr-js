[package]
name = "uwebr-render"
description = "wgpu + vello GPU renderer for uwebr"
license.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
# No wgpu/winit here: this crate builds scenes only. GPU device/surface work
# lives in uwebr-app. Depending on wgpu 30 here also pulled in a second wgpu
# alongside the 29 that vello 0.10 requires.
vello.workspace = true
taffy.workspace = true
parley.workspace = true
kurbo.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uwebr-core.workspace = true
uwebr-css.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }
[[bench]]
name = "render_bench"
harness = false
