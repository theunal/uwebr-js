[package]
name = "uwebr-app"
description = "Application runner for uwebr apps"
license.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
uwebr-core = { workspace = true }
uwebr-render = { workspace = true }
winit = "0.30"
# Must match the wgpu that vello 0.10 links against, otherwise the Device/Queue
# types handed to vello come from a different crate version.
wgpu = "29"
vello = "0.10"
taffy = "0.14"
peniko = "0.6"
pollster = "0.4"
log = "0.4"
arboard = "3"

[dev-dependencies]
tempfile.workspace = true
taffy = "0.14"
pollster = "0.4"
uwebr-render = { workspace = true }
